name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.tag.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag next version
        id: tag
        run: |
          svu="go run github.com/caarlos0/svu/v3@v3.4.1"
          next=$($svu next)
          [ "$next" = "$($svu current)" ] && exit 0
          git tag "$next"
          git push origin "$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.tag.outputs.next
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN trigger no workflows, so images are built here.
  images:
    needs: release
    if: needs.release.outputs.next && vars.DOCKERHUB_USERNAME
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [api, web]
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/gnotes-${{ matrix.target }}
      VERSION: ${{ needs.release.outputs.next }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.next }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }},${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
