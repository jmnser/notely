name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Runs one at a time, so two pushes never compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag
    outputs:
      next: ${{ steps.tag.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Tag next version
        id: tag
        run: |
          svu="go run github.com/caarlos0/svu/v3@v3.4.4"
          next=$($svu next --v0) # breaking changes stay on v0.x
          [ "$next" = "$($svu current)" ] && exit 0
          git tag "$next"
          git push origin "$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.next
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's cache key is shared with CI, which never builds the other
      # targets, so the release keeps its own cache and saves it every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-${{ hashFiles('go.sum') }}-
            release-
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN trigger no workflows, so the image is built here.
  image:
    needs: tag
    if: needs.tag.outputs.next && vars.DOCKERHUB_USERNAME
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/notely
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}
          persist-credentials: false
      # The v prefix is for the Git tag only; image and chart use the plain version.
      - name: Version
        id: version
        run: |
          echo "version=${NEXT#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        env:
          NEXT: ${{ needs.tag.outputs.next }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:${{ steps.version.outputs.version }} # tags are immutable on Docker Hub
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ steps.version.outputs.sha }}
          cache-from: type=gha,scope=notely
          cache-to: type=gha,mode=max,scope=notely
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  # The chart pins the image by digest, so chart and image cannot drift.
  chart:
    needs: [tag, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # keyless signing
    env:
      REGISTRY: registry-1.docker.io
      USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      VERSION: ${{ needs.image.outputs.version }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Package
        run: |
          yq -i '.image.digest = strenv(DIGEST)' chart/values.yaml
          helm package chart --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Chart references the pushed image
        run: |
          want="docker.io/$USERNAME/notely:$VERSION@$DIGEST"
          got=$(helm template notely "dist/notely-chart-$VERSION.tgz" --set route.hostname=example.org |
            yq 'select(.kind == "Deployment") | .spec.template.spec.containers[0].image')
          [ "$got" = "$want" ] || { echo "::error::chart image is $got, want $want"; exit 1; }
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push and sign
        run: |
          helm registry login "$REGISTRY" --username "$USERNAME" --password-stdin <<< "$TOKEN"
          helm push "dist/notely-chart-$VERSION.tgz" "oci://$REGISTRY/$USERNAME" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: //p' push.log)
          [ -n "$digest" ] || { echo "::error::no chart digest in the helm push output"; exit 1; }
          # docker.io, not $REGISTRY: docker/login-action stores the credentials under docker.io.
          cosign sign --yes "docker.io/$USERNAME/notely-chart@$digest"
        env:
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
