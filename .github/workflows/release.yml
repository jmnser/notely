name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

# Runs one at a time, so two pushes never compute the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag
    outputs:
      next: ${{ steps.tag.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Tag next version
        id: tag
        run: |
          svu="go run github.com/caarlos0/svu/v3@v3.4.1"
          next=$($svu next --v0) # breaking changes stay on v0.x
          [ "$next" = "$($svu current)" ] && exit 0
          git tag "$next"
          git push origin "$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    if: needs.tag.outputs.next
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # setup-go's cache key is shared with CI, which never builds the other
      # targets, so the release keeps its own cache and saves it every run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: release-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            release-${{ hashFiles('go.sum') }}-
            release-
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN trigger no workflows, so the image is built here.
  image:
    needs: tag
    if: needs.tag.outputs.next && vars.DOCKERHUB_USERNAME
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/notely
      VERSION: ${{ needs.tag.outputs.next }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.next }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }} # tags are immutable on Docker Hub
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=notely
          cache-to: type=gha,mode=max,scope=notely
