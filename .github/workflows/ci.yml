name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Portability: everything builds and tests without cgo.
env:
  CGO_ENABLED: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, js/wasm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set target
        run: |
          echo "GOOS=${TARGET%/*}" >> "$GITHUB_ENV"
          echo "GOARCH=${TARGET#*/}" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go.mod is tidy
        run: go mod tidy -diff
      - run: go test ./...
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Keep the backend and the size out of the wasm
        # internal/api and its server-only dependencies must not reach the browser.
        env: {GOOS: js, GOARCH: wasm, MAX_BYTES: '11000000'}
        run: |
          if go list -deps ./cmd/notely | grep -E '^(github.com/jmnser/notely/internal/api|github.com/go-git/|golang.org/x/crypto/argon2)'; then
            echo "::error::the wasm imports server-only packages"; exit 1
          fi
          go build -ldflags "-s -w" -o app.wasm ./cmd/notely
          size=$(stat -c %s app.wasm)
          echo "app.wasm: $size bytes (max $MAX_BYTES)"
          [ "$size" -le "$MAX_BYTES" ] || { echo "::error::app.wasm is larger than $MAX_BYTES bytes"; exit 1; }
      - name: Race detector (needs cgo; test only)
        run: go test -race ./...
        env:
          CGO_ENABLED: '1'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          args: release --snapshot --clean
