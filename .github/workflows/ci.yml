name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Portability: everything builds and tests without cgo.
env:
  CGO_ENABLED: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, js/wasm]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set target
        run: |
          echo "GOOS=${TARGET%/*}" >> "$GITHUB_ENV"
          echo "GOARCH=${TARGET#*/}" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Keep the backend and the size out of the wasm
        env: {GOOS: js, GOARCH: wasm, MAX_BYTES: '11000000'}
        run: |
          if go list -deps ./cmd/notely | grep -x github.com/jmnser/notely/internal/api; then
            echo "::error::the wasm imports internal/api"; exit 1
          fi
          go build -ldflags "-s -w" -o app.wasm ./cmd/notely
          size=$(stat -c %s app.wasm)
          echo "app.wasm: $size bytes (max $MAX_BYTES)"
          [ "$size" -le "$MAX_BYTES" ] || { echo "::error::app.wasm is larger than $MAX_BYTES bytes"; exit 1; }
      - name: Race detector (needs cgo; test only)
        run: go test -race ./...
        env:
          CGO_ENABLED: '1'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --snapshot --clean
