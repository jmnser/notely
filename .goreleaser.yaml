version: 2

before:
  hooks:
    - env GOOS=js GOARCH=wasm go build -ldflags "-s -w" -o cmd/notely-web/web/app.wasm ./cmd/notely-web

builds:
  - &build
    id: notely-api
    main: ./cmd/notely-api
    binary: notely-api
    env: [CGO_ENABLED=0]
    goarch: [amd64, arm64]
  - <<: *build
    id: notely-web
    main: ./cmd/notely-web
    binary: notely-web
