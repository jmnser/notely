version: 2

before:
  hooks:
    - env GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o cmd/notely/web/app.wasm ./cmd/notely

builds:
  - id: notely
    main: ./cmd/notely
    binary: notely
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Tag}}"] # v-prefixed, as the image
    goarch: [amd64, arm64]
