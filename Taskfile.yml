version: '3'

# Portability: everything builds and tests without cgo.
env:
  CGO_ENABLED: '0'

tasks:
  wasm:
    desc: Build the frontend
    sources: [go.mod, go.sum, cmd/notely/*.go, internal/**/*.go]
    generates: [cmd/notely/web/app.wasm]
    env: {GOOS: js, GOARCH: wasm}
    cmd: go build -trimpath -ldflags "-s -w" -o cmd/notely/web/app.wasm ./cmd/notely

  build:
    desc: Build bin/notely
    deps: [wasm]
    cmd: go build -o bin/ ./cmd/...

  run:
    desc: Run notely locally on http://localhost:8000
    deps: [build]
    cmd: ./bin/notely

  image:
    desc: Build the notely container image, tagged with VERSION
    vars:
      REVISION:
        sh: git rev-parse HEAD
      TAG: '{{.VERSION | default (print "v0.0.0-" (trunc 7 .REVISION))}}'
    cmd: >-
      docker build -t notely:{{.TAG}}
      --build-arg VERSION={{.TAG}} --build-arg REVISION={{.REVISION}} .

  test:
    desc: Run the tests
    cmd: go test ./...

  test:race:
    desc: Run the tests with the race detector (needs cgo on Linux; test only)
    env: {CGO_ENABLED: '1'}
    cmd: go test -race ./...

  lint:
    desc: Lint server and wasm code
    cmds:
      - golangci-lint run
      - GOOS=js GOARCH=wasm golangci-lint run

  lint:fix:
    desc: Lint and apply fixes
    cmds:
      - golangci-lint run --fix
      - GOOS=js GOARCH=wasm golangci-lint run --fix
